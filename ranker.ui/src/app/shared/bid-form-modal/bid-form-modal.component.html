@if (modal.bidFormModal(); as payload) {
  <!--
    Backdrop — NO (click) handler on purpose: clicking outside does nothing.
    Only the ✕ button, Cancel button, or Escape key close the modal.
  -->
  <div
    class="modal-backdrop"
    (keydown)="onKeydown($event)"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="bid-modal-title"
  >
    <div class="modal-panel" (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="modal-panel__header">
        <div>
          <h2 class="modal-panel__title" id="bid-modal-title">{{ title() }}</h2>
          <p class="modal-panel__subtitle">
            Min starting bid: <strong>{{ payload.minStartingBid | number: '1.2-2' }}</strong>
            &nbsp;·&nbsp; Min increment: <strong>{{ payload.minBidIncrement | number: '1.2-2' }}</strong>
          </p>
        </div>
        <button
          type="button"
          class="modal-panel__close"
          (click)="close()"
          [disabled]="submitting()"
          aria-label="Close"
        >✕</button>
      </div>

      <!-- Mode toggle -->
      <button type="button" class="pill" (click)="switchMode()">
        {{ isRebid() ? '+ Start a new listing instead' : '↩ Rebid on an existing listing' }}
      </button>

      <!-- New listing fields -->
      @if (!isRebid()) {
        <label>
          Listing name
          <input
            type="text"
            [ngModel]="listingName()"
            (ngModelChange)="listingName.set($event)"
            placeholder="e.g. My Awesome Product"
            [disabled]="submitting()"
          />
        </label>
        <label>
          Listing URL
          <input
            type="url"
            [ngModel]="listingUrl()"
            (ngModelChange)="listingUrl.set($event)"
            placeholder="https://..."
            [disabled]="submitting()"
          />
        </label>
      }

      <!-- Common fields -->
      <label>
        Owner contact email
        <input
          type="email"
          [ngModel]="ownerEmail()"
          (ngModelChange)="ownerEmail.set($event)"
          placeholder="you@example.com"
          [disabled]="submitting()"
        />
      </label>
      <label>
        Target bid amount (₹)
        <input
          type="number"
          [ngModel]="targetAmount()"
          (ngModelChange)="targetAmount.set($event ? +$event : null)"
          placeholder="0.00"
          min="1"
          step="0.01"
          [disabled]="submitting()"
        />
      </label>

      <!-- Actions -->
      <div class="modal-panel__actions">
        <button type="button" class="btn" (click)="close()" [disabled]="submitting()">
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="submitting()"
          (click)="proceedToCheckout()"
        >
          {{ submitting() ? 'Processing...' : '💳 Proceed to Checkout' }}
        </button>
      </div>

    </div>
  </div>
}
