<footer class="app-footer">
  <div class="footer-inner">
    <!-- Top row: Brand & Operations status -->
    <div class="footer-main">
      <div class="footer-brand-wrap">
        <div class="footer-brand">
          <svg class="footer-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="9" fill="var(--color-primary, #ff5a36)" />
            <path d="M16 7L24 20H8L16 7Z" fill="#FFFFFF" />
            <rect x="10.5" y="22" width="11" height="2.5" rx="1" fill="#FFFFFF" fill-opacity="0.85" />
          </svg>
          <span class="brand-text">RankUp</span>
          <span class="verifiable-badge">
            <span class="material-symbols-outlined text-[13px]">verified</span>
            100% Verifiable Discovery
          </span>
        </div>
        <p class="brand-desc">
          © {{ currentYear }} RankUp • Built by Shekhar • Est. Sep 2026
        </p>
      </div>

      <div class="footer-status-links">
        <button type="button" class="operational-pill" [class.is-operational]="healthService.status() === 'operational'"
          [class.is-degraded]="healthService.status() === 'degraded'"
          [class.is-offline]="healthService.status() === 'offline'"
          [class.is-checking]="healthService.status() === 'checking' || healthService.isChecking()"
          [title]="healthService.statusTooltip()" [attr.aria-label]="healthService.statusTooltip()"
          (click)="onCheckHealth()">
          <span class="op-dot"></span>
          <span class="op-text">{{ healthService.statusLabel() }}</span>
        </button>

        <nav class="footer-nav">
          <a routerLink="/analytics" class="footer-link">Traffic &amp; Analytics</a>
          <a routerLink="/rules" class="footer-link">Rules &amp; Governance</a>
          <a routerLink="/terms" class="footer-link">Terms of Service</a>
          <a routerLink="/privacy" class="footer-link">Privacy Policy</a>
          <a routerLink="/contact" class="footer-link">Contact</a>
        </nav>
      </div>
    </div>

    <!-- Bottom sub-bar -->
    <div class="footer-sub-bar">
      <span class="sub-disclaimer">
        Transparent sponsored ranking placements reset daily at 00:00 UTC.
      </span>

      <div class="footer-socials">
        <a routerLink="/contact" class="social-icon" title="Community & Support" aria-label="Community & Support">
          <span class="material-symbols-outlined text-[18px]">forum</span>
        </a>
        <a routerLink="/daily" class="social-icon" title="Public Broadcasts" aria-label="Public Broadcasts">
          <span class="material-symbols-outlined text-[18px]">public</span>
        </a>
      </div>
    </div>
  </div>
</footer>
