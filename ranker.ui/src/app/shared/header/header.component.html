<header class="site-header">
  <div class="site-header__inner">

    <a routerLink="/" class="site-header__brand">
      <span class="site-header__logo">⚡</span>
      <span class="site-header__brand-name">RankIt</span>
    </a>

    <span class="site-header__tagline">Rank, claim, and grow your presence — <em>in one place.</em></span>

    <!-- ── Merged stats pill (left of nav) ── -->
    <div class="site-header__stats">
      <span class="site-header__online-dot" aria-hidden="true"></span>
      <span class="site-header__stats-online" title="Users currently online">{{ onlineUsers() }} online</span>
      @if (visitsToday() !== null) {
        <span class="site-header__stats-sep" aria-hidden="true"></span>
        <span class="site-header__stats-visits" title="Unique visitors today">👁 {{ visitsToday() }} visited</span>
      }
    </div>

    <nav class="site-header__nav">
      <a routerLink="/categories" routerLinkActive="active">Categories</a>
      <a routerLink="/daily" routerLinkActive="active">Daily</a>
      <a routerLink="/rules" routerLinkActive="active">Rules</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>

    <div class="site-header__actions">
      <button type="button" class="site-header__theme-toggle" (click)="theme.toggle()" aria-label="Toggle dark mode">
        {{ theme.dark() ? '☀️' : '🌙' }}
      </button>
    </div>

  </div>
</header>
