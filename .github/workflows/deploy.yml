name: Build & Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
      - feature/postgres-migration
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. BUILD & TEST BACKEND (.NET 10)
  # ============================================================================
  build-backend:
    name: Build & Test Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        run: |
          mkdir -p /usr/share/dotnet
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir /usr/share/dotnet
          echo "/usr/share/dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=/usr/share/dotnet" >> $GITHUB_ENV

      - name: Verify .NET Version
        run: dotnet --version

      - name: Restore Dependencies
        run: dotnet restore backend/Ranker.slnx

      - name: Run Backend Tests
        run: dotnet test backend/ranker.Tests/ranker.Tests.csproj --no-restore -c Release --verbosity normal

      - name: Publish Backend
        run: dotnet publish backend/ranker/ranker.csproj -c Release -o publish/backend --no-restore

      - name: Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish/backend
          retention-days: 1

  # ============================================================================
  # 2. BUILD FRONTEND (Angular 20 SSR)
  # ============================================================================
  build-frontend:
    name: Build Frontend (Angular SSR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ranker.ui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ranker.ui
        run: npm ci

      - name: Build Angular Application
        working-directory: ranker.ui
        run: npm run build

      - name: Prepare Frontend Bundle
        run: |
          mkdir -p publish/frontend
          cp -r ranker.ui/dist publish/frontend/
          cp ranker.ui/package.json publish/frontend/
          cp ranker.ui/package-lock.json publish/frontend/

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-publish
          path: publish/frontend
          retention-days: 1

  # ============================================================================
  # 3. DEPLOY TO UBUNTU SERVER
  # ============================================================================
  deploy:
    name: Deploy to Ubuntu Host
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: publish/backend

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-publish
          path: publish/frontend

      - name: Configure SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add Server to Known Hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts

      - name: Generate Backend Production Environment File
        env:
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_CREDENTIALS_JSON: ${{ secrets.GA_CREDENTIALS_JSON }}
        run: |
          python3 - << 'PYEOF'
          import os

          conn = os.environ.get('PROD_CONNECTION_STRING', '').strip()
          rzp_id = os.environ.get('RAZORPAY_KEY_ID', '').strip()
          rzp_sec = os.environ.get('RAZORPAY_KEY_SECRET', '').strip()
          ga_prop = os.environ.get('GA_PROPERTY_ID', '').strip()
          ga_json = os.environ.get('GA_CREDENTIALS_JSON', '').strip()

          lines = [
              "ASPNETCORE_ENVIRONMENT=Production",
              "ASPNETCORE_URLS=http://127.0.0.1:5000",
              "ASPNETCORE_HTTP_PORTS=5000",
              f"ConnectionStrings__RankerDb={conn}",
              f"Razorpay__KeyId={rzp_id}",
              f"Razorpay__KeySecret={rzp_sec}",
          ]

          if ga_prop:
              lines.append(f"GoogleAnalytics__PropertyId={ga_prop}")

          if ga_json:
              with open("publish/backend/ga-credentials.json", "w", encoding="utf-8") as f:
                  f.write(ga_json)
              lines.append("GoogleAnalytics__CredentialsFilePath=/var/www/ranker/backend/ga-credentials.json")
              print("Injected Google Analytics service account credentials into publish/backend/ga-credentials.json.")

          lines.append("")

          with open("publish/backend/.env", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))

          print("Generated publish/backend/.env successfully.")
          if not conn:
              print("::warning::PROD_CONNECTION_STRING is not set in GitHub Secrets! Backend will run in Degraded mode without DB.")
          PYEOF

      - name: Sync Backend Files via Rsync
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          rsync -az \
            --no-owner \
            --no-group \
            --no-perms \
            --no-times \
            --delete \
            -e "ssh -p ${SERVER_PORT}" \
            publish/backend/ \
            "${SERVER_USER}@${SERVER_HOST}:/var/www/ranker/backend/"

      - name: Sync Frontend Files via Rsync
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          rsync -az \
            --no-owner \
            --no-group \
            --no-perms \
            --no-times \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh -p ${SERVER_PORT}" \
            publish/frontend/ \
            "${SERVER_USER}@${SERVER_HOST}:/var/www/ranker/frontend/"

      - name: Configure Permissions, Install Dependencies & Restart Services
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          ssh -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" bash -s << 'EOF'
            set -euo pipefail

            # 1. Fix directory ownership & permissions for www-data execution
            sudo chown -R www-data:www-data /var/www/ranker
            sudo chmod -R 775 /var/www/ranker
            if [ -f /var/www/ranker/backend/.env ]; then
              sudo chmod 644 /var/www/ranker/backend/.env
            fi

            # 2. Install production dependencies for frontend SSR
            cd /var/www/ranker/frontend
            npm install --omit=dev --no-audit --no-fund --cache /tmp/npm-cache

            # 3. Restart systemd services
            echo "Restarting services..."
            sudo systemctl restart ranker-backend
            sudo systemctl restart ranker-frontend

            # 4. Verify systemd service status
            sleep 3
            if ! sudo systemctl is-active --quiet ranker-backend; then
              echo "ERROR: ranker-backend failed to start!"
              sudo journalctl -u ranker-backend -n 50 --no-pager
              exit 1
            fi

            if ! sudo systemctl is-active --quiet ranker-frontend; then
              echo "ERROR: ranker-frontend failed to start!"
              sudo journalctl -u ranker-frontend -n 50 --no-pager
              exit 1
            fi

            echo "Both services are active and running."
          EOF

      - name: Verify Backend Health Check
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          ssh -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" bash -s << 'EOF'
            set -euo pipefail

            echo "Polling http://127.0.0.1:5000/api/health..."
            for attempt in {1..12}; do
              if curl -s -f http://127.0.0.1:5000/api/health > /dev/null 2>&1; then
                echo "--> Backend responded successfully on attempt $attempt!"
                curl -s http://127.0.0.1:5000/api/health
                echo ""
                exit 0
              fi
              echo "Waiting for backend on port 5000... (attempt $attempt/12)"
              sleep 2
            done

            echo "============================================="
            echo " ERROR: Backend did not respond on port 5000"
            echo "============================================="
            echo "--> Systemd service status:"
            sudo systemctl status ranker-backend --no-pager || true
            echo "--> Recent application logs (journalctl):"
            sudo journalctl -u ranker-backend -n 60 --no-pager || true
            exit 1
          EOF

      - name: Verify Frontend Health Check
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          ssh -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" bash -s << 'EOF'
            set -euo pipefail

            echo "Polling http://127.0.0.1:4000 (Angular SSR)..."
            for attempt in {1..12}; do
              if curl -s -f http://127.0.0.1:4000 > /dev/null 2>&1; then
                echo "--> Angular SSR responded successfully on attempt $attempt!"
                exit 0
              fi
              echo "Waiting for frontend on port 4000... (attempt $attempt/12)"
              sleep 2
            done

            echo "============================================="
            echo " ERROR: Frontend did not respond on port 4000"
            echo "============================================="
            echo "--> Systemd service status:"
            sudo systemctl status ranker-frontend --no-pager || true
            echo "--> Recent application logs (journalctl):"
            sudo journalctl -u ranker-frontend -n 60 --no-pager || true
            exit 1
          EOF
