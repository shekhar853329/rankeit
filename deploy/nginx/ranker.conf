map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 301 Permanent Redirect: www.rankup.cyou -> rankup.cyou
server {
    listen 80;
    listen [::]:80;
    server_name www.rankup.cyou;
    return 301 https://rankup.cyou$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name rankup.cyou;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml font/woff font/woff2 application/font-woff;

    # Security Headers (Best Practices & Trust/Safety)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://checkout.razorpay.com https://api.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://rankup.cyou wss://rankup.cyou https://www.google-analytics.com https://*.googletagmanager.com https://api.razorpay.com https://*.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self';" always;

    # Internal health check endpoint (allowed for local server / CI monitoring)
    location = /api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. ASP.NET Core REST API (Protected: only accessible via Angular UI)
    location /api/ {
        # Block direct access from external scrapers/tools lacking the Angular verification header
        if ($http_x_app_client != "Ranker-UI-Client") {
            return 403 '{"error": "Forbidden", "message": "Direct API access is restricted. Only the Ranker frontend application can communicate with this API."}\n';
        }

        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. SignalR Real-Time WebSocket Hub (Protected against cross-site hijacking)
    location /hubs/ {
        # Block cross-site embedding or unauthorized third-party connections
        if ($http_sec_fetch_site = "cross-site") {
            return 403;
        }

        proxy_pass http://127.0.0.1:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Keep alive SignalR connection
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 3. Crawler & AI metadata files (robots.txt, sitemap.xml, llms.txt)
    location ~* ^/(?:robots\.txt|sitemap\.xml|llms\.txt|manifest\.webmanifest)$ {
        root /var/www/ranker/frontend/dist/ranker.ui/browser;
        expires 1d;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @ssr_proxy;
    }

    # 4. Static Client Assets (Direct Nginx Cache)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot|webp|txt|xml|json)$ {
        root /var/www/ranker/frontend/dist/ranker.ui/browser;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri @ssr_proxy;
    }

    # 5. Angular SSR Application (Serves pre-rendered static routes directly, proxies dynamic routes to Node SSR)
    location / {
        root /var/www/ranker/frontend/dist/ranker.ui/browser;
        try_files $uri $uri/index.html @ssr_proxy;
    }

    location @ssr_proxy {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
