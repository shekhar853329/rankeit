map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Replace '_' with your domain name (e.g., example.com) when you point a domain
    server_name _;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Internal health check endpoint (allowed for local server / CI monitoring)
    location = /api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. ASP.NET Core REST API (Protected: only accessible via Angular UI)
    location /api/ {
        # Block direct access from external scrapers/tools lacking the Angular verification header
        if ($http_x_app_client != "Ranker-UI-Client") {
            return 403 '{"error": "Forbidden", "message": "Direct API access is restricted. Only the Ranker frontend application can communicate with this API."}\n';
        }

        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. SignalR Real-Time WebSocket Hub (Protected against cross-site hijacking)
    location /hubs/ {
        # Block cross-site embedding or unauthorized third-party connections
        if ($http_sec_fetch_site = "cross-site") {
            return 403;
        }

        proxy_pass http://127.0.0.1:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Keep alive SignalR connection
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 3. Static Client Assets (Direct Nginx Cache)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        root /var/www/ranker/frontend/dist/ranker.ui/browser;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri @ssr_proxy;
    }

    # 4. Angular SSR Application
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @ssr_proxy {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
